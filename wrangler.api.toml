# Chatbot API backend worker (phase 1: stateless routes).
# Deployed as "t-api" on the same (second) Cloudflare account.
# Server keys are Worker Secrets, e.g.:
#   wrangler secret put GEMINI_API_KEY --config wrangler.api.toml
name = "t-api"
main = "api.js"
compatibility_date = "2024-01-01"

# Persistent state for Telegram routes (config, logs, update cursor).
[[kv_namespaces]]
binding = "CHATBOT_STATE"
id = "a9822e85484e4ce287da7eeb4ae9f094"

# Frontend static files (built by CI into dist/) are served by this
# same worker — one URL for app + API, no CORS setup needed.
[assets]
directory = "dist"
not_found_handling = "single-page-application"
