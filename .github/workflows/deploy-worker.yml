name: Deploy Telegram Worker

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker (Telegram proxy)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # NOTE: ALLOWED_ORIGINS is intentionally not passed here until the
          # site URL is known. wrangler.toml defaults it to "" (browser
          # calls denied, server-to-server works). Set it later in
          # Cloudflare dashboard → Worker → Settings → Variables, or add
          # an ALLOWED_ORIGINS repo secret and re-add:
          #   --var ALLOWED_ORIGINS:${{ secrets.ALLOWED_ORIGINS }}
          command: deploy --name chatbot-telegram-proxy
