name: Deploy Telegram Worker

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker (Telegram proxy)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy --name chatbot-telegram-proxy
            --var ALLOWED_ORIGINS:${{ secrets.ALLOWED_ORIGINS }}

      # Optional: only runs when PROXY_TOKEN secret exists.
      - name: Sync Worker secret (PROXY_TOKEN)
        if: ${{ secrets.PROXY_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: secret put PROXY_TOKEN --name chatbot-telegram-proxy
          secrets: |
            PROXY_TOKEN
        env:
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
