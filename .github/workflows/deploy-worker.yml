name: Deploy Telegram Worker

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker (Telegram proxy)
        # NOTE: ALLOWED_ORIGINS is intentionally not passed until the site
        # URL is known. wrangler.toml defaults it to "" (browser calls
        # denied, server-to-server works). Set it later in Cloudflare
        # dashboard → Worker → Settings → Variables.
        run: wrangler deploy --name chatbot-telegram-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
